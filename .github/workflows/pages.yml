name: deploy-pages
# Manual only: nothing is published until you run this workflow (Actions tab > deploy-pages > Run workflow).
# One-time setup: repo Settings > Pages > Source: GitHub Actions. Optional repo variables (Settings > Variables):
# FUNNELS_URL and CONVERSATIONS_URL; a link whose variable is unset stays disabled on the page.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
        env:
          FUNNELS_URL: ${{ vars.FUNNELS_URL }}
          CONVERSATIONS_URL: ${{ vars.CONVERSATIONS_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
